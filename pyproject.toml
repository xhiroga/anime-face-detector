[project]
name = "anime-face-detector"
version = "0.0.5"
readme = "README.md"
requires-python = ">=3.10"
# For code compatibility, mmpose<=0.29.0 required.
# mmpose requires mmcv>=1.3.8, <=1.7.0.
# mmdet v3.x requires mmcv>=2.0.0rc4, <2.2.0, so do NOT use this.
# mmdet v2.x requires mmcv>=1.3.17, <=1.6.0.
dependencies = [
    "mmcv-full>=1.6.0",
    "mmdet==2.25.0",
    "mmengine>=0.10.7",
    "mmpose<=0.29.0",
    "numpy>=1.23,<2",
    "opencv-python-headless>=4.11.0.86",
    "openmim>=0.3.9",
    "torch==1.12.1",
    "torchvision==0.13.1",
]

[project.optional-dependencies]
demo = [
    "gradio>3.0.0,<4.0.0",
    "huggingface-hub<1.0.0",
]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]
xtcocotools = ["numpy"]

# Aligned with https://mmcv.readthedocs.io/en/1.x/get_started/installation.html
[[tool.uv.index]]
name = "pytorch-cu116"
url = "https://download.pytorch.org/whl/cu116"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu116" }
torchvision = { index = "pytorch-cu116" }
mmcv-full = { url = "https://download.openmmlab.com/mmcv/dist/cu116/torch1.12.0/mmcv_full-1.6.0-cp310-cp310-manylinux1_x86_64.whl" }
