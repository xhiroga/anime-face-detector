[project]
name = "anime-face-detector"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mmcv==2.2.0",
    "mmcv-lite==2.2.0",
    "mmdet>=3.3.0",
    "mmengine>=0.10.7",
    "mmpose>=1.3.2",
    "numpy>=2.4.0",
    "opencv-python-headless>=4.11.0.86",
    "openmim>=0.3.9",
    "torch==2.4.1",
    "torchvision==0.19.1",
]

[project.optional-dependencies]
demo = [
    "gradio>=6.2.0",
]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]   
xtcocotools = ["numpy"]

# Aligned with https://mmcv.readthedocs.io/en/latest/get_started/installation.html (v2.2.0)
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.4.0/mmcv-2.2.0-cp312-cp312-manylinux1_x86_64.whl" }
