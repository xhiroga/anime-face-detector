[project]
name = "anime-face-detector"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"  # mmcv supports <3.11
dependencies = [
    "mmcv>=2.0.0rc4,<2.2.0",    # To avoid AssertionError: MMCV==1.7.2 is used but incompatible. Please install mmcv>=2.0.0rc4, <2.2.0.
    "mmcv-full>=1.7.2",
    "mmdet>=3.3.0",
    "mmengine>=0.10.7",
    "mmpose>=1.3.2",
    "numpy>=2.2.6",
    "opencv-python-headless>=4.12.0.88",
    "openmim>=0.3.9",
    "torch==2.9.1",
    "torchvision==0.24.1",
]

[project.optional-dependencies]
demo = [
    "gradio>=6.2.0",
]

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
